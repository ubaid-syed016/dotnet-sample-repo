name: Build and Analyze

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Analyze with SonarQube
    runs-on: windows-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history is required by SonarQube

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      # Step 3: Cache SonarScanner packages
      - name: Cache SonarScanner packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Step 4: Cache dotnet SonarScanner
      - name: Cache SonarScanner CLI
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      # Step 5: Install SonarScanner CLI for .NET
      - name: Install SonarScanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      # Step 6: Build and Analyze
      - name: Build and Run SonarQube Analysis
        shell: powershell
        working-directory: .  # Ensure this is where your .csproj is
        run: |
          # Initialize SonarQube analysis
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" begin `
              /k:"myjava" `
              /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
              /d:sonar.login="${{ secrets.SONAR_TOKEN }}" `
              /d:sonar.verbose=true

          # Build the project
          dotnet build

          # Complete the analysis
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end `
              /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
